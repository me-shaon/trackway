<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" width="880" height="494"
     role="img" aria-label="How Trackway works, as a pipeline">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#9aa0a7"/>
    </marker>
  </defs>

  
  <g>
    <rect x="190" y="22" width="400" height="62" rx="9"
          fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1"/>
    
    <text x="390" y="48" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5"
          font-weight="600" fill="#22262c">Agent session files</text>
    <text x="390" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                 font-size="11.5" fill="#6a7179">written to disk by the agent as you work</text>
  </g>

  <g>
    <path d="M604 53 H650" stroke="#9aa0a7" stroke-width="1"
          stroke-dasharray="3 3" fill="none"/>
    <text x="660" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600"
          fill="#6a7179">Nothing is hooked.</text>
    <text x="660" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"
          fill="#6a7179">You keep working normally.</text>
  </g>

  <path d="M390 86 V110" stroke="#9aa0a7" stroke-width="1.4"
                 fill="none" marker-end="url(#tip)"/>
  
  <g>
    <rect x="190" y="112" width="400" height="62" rx="9"
          fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1"/>
    
    <text x="390" y="138" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5"
          font-weight="600" fill="#22262c">Parse, strip reasoning, redact</text>
    <text x="390" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                 font-size="11.5" fill="#6a7179">model thinking removed, credentials scrubbed</text>
  </g>

  <path d="M390 176 V193 H221 V210" stroke="#9aa0a7" stroke-width="1.4"
                 fill="none" marker-end="url(#tip)" stroke-linejoin="round"/>
  <path d="M390 176 V193 H559 V210" stroke="#9aa0a7" stroke-width="1.4"
                 fill="none" marker-end="url(#tip)" stroke-linejoin="round"/>

  
  <g>
    <rect x="62" y="214" width="318" height="78" rx="9"
          fill="#f5f5f2" stroke="#3f9a7c" stroke-width="1"/>
    <path d="M63 223 v60" stroke="#3f9a7c" stroke-width="3" stroke-linecap="round"/>
    <text x="221" y="240" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5"
          font-weight="600" fill="#22262c">Harvest recorded forks</text>
    <text x="221" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                 font-size="11.5" fill="#6a7179">verbatim from the session, no model call</text>
  </g>
  
  <g>
    <rect x="400" y="214" width="318" height="78" rx="9"
          fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1"/>
    
    <text x="559" y="240" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5"
          font-weight="600" fill="#22262c">Distil the rest</text>
    <text x="559" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                 font-size="11.5" fill="#6a7179">your own agent, headless</text>
  </g>

  <text x="221" y="312" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#3f9a7c"
        letter-spacing="0.4">DETERMINISTIC</text>
  <text x="559" y="312" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6a7179"
        letter-spacing="0.4">MODEL-EXTRACTED</text>

  <path d="M221 322 V334 H390 V346" stroke="#9aa0a7" stroke-width="1.4"
                 fill="none" marker-end="url(#tip)" stroke-linejoin="round"/>
  <path d="M559 322 V334 H390 V346" stroke="#9aa0a7" stroke-width="1.4"
                 fill="none" marker-end="url(#tip)" stroke-linejoin="round"/>

  
  <g>
    <rect x="190" y="348" width="400" height="66" rx="9"
          fill="#f4f1fb" stroke="#7a5cb8" stroke-width="1"/>
    <path d="M191 357 v48" stroke="#7a5cb8" stroke-width="3" stroke-linecap="round"/>
    <text x="390" y="374" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14"
          font-weight="600" fill="#22262c">.trackway/records/*.md</text>
    <text x="390" y="394" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                 font-size="11.5" fill="#6a7179">git-tracked — they show up in your diffs</text>
  </g>

  <path d="M390 416 V440" stroke="#9aa0a7" stroke-width="1.4"
                 fill="none" marker-end="url(#tip)"/>
  
  <g>
    <rect x="190" y="442" width="400" height="44" rx="9"
          fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1"/>
    
    <text x="390" y="469" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5"
          font-weight="600" fill="#22262c">search  ·  explorer  ·  MCP retrieval</text>
    
  </g>
</svg>
